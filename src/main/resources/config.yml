# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  MESSAGE DE BIENVENUE
#  Affiché uniquement à la première connexion du joueur.
#  Codes couleur : &a &c &f etc. + codes HEX &#RRGGBB
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
welcome:
  enabled: true
  msg: "&aBienvenue &f%player% &asur le Serveur !"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  CHAT
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
chat:
  # Format du message.
  #   %prefix%  → préfix LuckPerms (vide si absent)
  #   %player%  → nom du joueur
  #   %suffix%  → suffix LuckPerms (vide si absent)
  #   %message% → contenu du message
  format: "%prefix%%player%%suffix% &7: &f%message%"

  # Couleurs dans le chat
  # La permission fireballwand.chat.color doit être accordée pour &codes classiques.
  # La permission fireballwand.chat.color.hex pour les codes &#RRGGBB.
  color:
    enabled: true

  # Intégration ItemsAdder (grades en image dans le chat)
  # Nécessite ItemsAdder en soft-depend.
  # Le préfix LuckPerms doit contenir le placeholder ItemsAdder (:namespace:icon:)
  itemsadder:
    enabled: true

  # Message en vanish : forcer le "/" en fin de message pour envoyer
  vanish-chat-suffix: "/"
  vanish-chat-warning: "&7[Vanish] &cMettez &f/ &cen fin de message pour envoyer."

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  VANISH
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
vanish:
  # Niveau maximum scanné (fireballwand.vanish.level.N de 1 à max-level)
  max-level: 10

  # Action bar affichée tant que le joueur est en vanish
  actionbar:
    enabled: true
    message: "&8[ &7Vous êtes actuellement en vanish &8]"
    # Intervalle de rafraîchissement en ticks (20 ticks = 1 seconde)
    interval: 40

  # Double-sneak pour basculer en mode spectateur (et retour)
  spectator-on-sneak:
    enabled: true
    # Délai max en ms entre les deux sneaks pour valider le double-sneak
    double-sneak-delay: 400

  # Messages
  messages:
    enable: "&aVanish activé. &7(niveau &f%level%&7)"
    disable: "&cVanish désactivé."
    enable-other: "&aTon vanish a été activé par &f%player%&a."
    disable-other: "&cTon vanish a été désactivé par &f%player%&c."
    no-permission: "&cTu n'as pas la permission d'utiliser le vanish."
    no-permission-other: "&c%player% n'a pas la permission d'utiliser le vanish."
    player-not-found: "&cJoueur introuvable : &f%player%"
    spectator-on: "&7[Vanish] &aMode spectateur activé."
    spectator-off: "&7[Vanish] &cMode spectateur désactivé."

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  FIREWAND
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
firewand:
  name: "&cBâton de Feu"
  yield: 50.0
  incendiary: true

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  FREEZEWAND
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
freezewand:
  name: "&bBâton de Glace"
  messages:
    frozen: "&cTu es gelé."
    unfrozen: "&aTu es dégelé."
    target-frozen: "&bJoueur gelé."
    target-unfrozen: "&bJoueur dégelé."
    op-immune: "&c❌ Impossible de geler un OP."
    all-unfrozen: "&b❄ Tous les joueurs ont été dégelés !"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  KICK ARMOR
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
kickarmor:
  name: "&cPlastron du Kick"
  radius: 3.0
  kick-message: "Trop près d'un joueur protégé."

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  CHEATS (armes & armures)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
cheats:
  sword:
    name: "&4Épée Cheater"
  mace:
    name: "&6Mace Cheater"
  armor:
    name: "&4Armor Cheat"
