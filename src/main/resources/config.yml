# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  Activation des différents Modules
#  Ex: Money pour le moment xDD
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

modules:
  money:
    enabled: true

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  MESSAGE DE BIENVENUE
#  Affiché uniquement à la première connexion du joueur.
#  Codes couleur : &a &c &f etc. + codes HEX &#RRGGBB
#  Placeholders PlaceholderAPI supportés (ex: %server_online%)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
welcome:
  enabled: true
  msg: "&aBienvenue &f%player% &asur le Serveur !"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  MESSAGES DE CONNEXION / DÉCONNEXION
#  Message affiché à TOUT LE MONDE quand un joueur arrive ou part.
#  Également utilisé par le Vanish pour simuler les entrées/sorties.
#
#  mode :
#    DEFAULT → message vanilla, sans modification
#    CUSTOM  → ton message personnalisé (clé "message")
#    HIDDEN  → aucun message
#
#  Placeholders : %player%  → pseudo
#                 %prefix%  → préfix LuckPerms (vide si absent)
#                 %suffix%  → suffix LuckPerms (vide si absent)
#  Codes couleur : &a &c &f etc. + codes HEX &#RRGGBB
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
join-quit:
  join:
    mode: CUSTOM
    message: "&8[&a+&8] &f%prefix%%player%%suffix% &7a rejoint le serveur"

    # Message spécial à la toute première connexion d'un joueur
    # (prioritaire sur le mode ci-dessus, même en HIDDEN)
    first-join:
      enabled: true
      message: "&d✦ &f%player% &7rejoint le serveur pour la première fois !"

  quit:
    mode: CUSTOM
    message: "&8[&c-&8] &f%prefix%%player%%suffix% &7a quitté le serveur"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  CHAT
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
chat:
  # Format du message.
  #   %prefix%  → préfix LuckPerms (vide si absent)
  #   %player%  → nom du joueur
  #   %suffix%  → suffix LuckPerms (vide si absent)
  #   %message% → contenu du message
  # Tout placeholder PlaceholderAPI est aussi accepté
  format: "%prefix%%player%%suffix% &7: &f%message%"

  # Couleurs dans le chat
  color:
    enabled: true

  # Intégration PlaceholderAPI
  placeholderapi:
    enabled: true

  # Intégration ItemsAdder (grades en image dans le chat)
  itemsadder:
    enabled: true

  # Message en vanish : forcer le "/" en fin de message pour envoyer
  vanish-chat-suffix: "/"
  vanish-chat-warning: "&7[Vanish] &cMettez &f/ &cen fin de message pour envoyer."

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  MESSAGES PRIVÉS (MSG)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
messages:
  format-to: "&7[To &f%target%&7] &f%message%"
  format-from: "&7[From &f%sender%&7] &f%message%"