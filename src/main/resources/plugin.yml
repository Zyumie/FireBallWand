name: FireballWand
main: fr.zyumie.fireballwand.Main
version: ${Version}
api-version: '1.21'
author: Zyumie
softdepend: [LuckPerms, ItemsAdder]

commands:
  firewand:
    description: Donne le bâton de feu
    usage: /firewand
    permission: fireballwand.firewand

  kickarmor:
    description: Donne une armure qui kick les joueurs à portée
    usage: /kickarmor
    permission: fireballwand.kickarmor

  freezewand:
    description: Donne un bâton qui freeze/unfreeze les joueurs
    usage: /freezewand
    permission: fireballwand.freezewand

  unfreezewand-all:
    description: Dégèle tous les joueurs
    usage: /unfreezewand-all
    permission: fireballwand.unfreezewand

  wincharge_boosted:
    description: Donne une WinChargeBoosted qui tue
    usage: /wincharge_boosted
    permission: fireballwand.wincharge_boosted

  cheatsword:
    description: Donne une épée Cheat
    usage: /cheatsword
    permission: fireballwand.cheatsword

  cheatmace:
    description: Donne une Mace Cheat
    usage: /cheatmace
    permission: fireballwand.cheatmace

  diamond_armorcheat:
    description: Donne une armure en Diamant Cheat
    usage: /diamond_armorcheat
    permission: fireballwand.diamond_armorcheat

  netherite_armorcheat:
    description: Donne une armure en Netherite Cheat
    usage: /netherite_armorcheat
    permission: fireballwand.netherite_armorcheat

  potionofdeath:
    description: Obtenir la Potion of Death
    usage: /potionofdeath
    aliases: [ pod ]
    permission: fireballwand.potion-of-death

  starterkit:
    description: Récupérer le kit de départ.
    usage: /starterkit
    permission: fireballwand.starterkit

  msg:
    description: Envoyer un message privé
    usage: /msg <joueur> <message>
    aliases: [tell, w]

  reply:
    description: Répondre au dernier message privé
    usage: /reply <message>
    aliases: [r, re]

  vanish:
    description: Active/désactive le vanish
    usage: /vanish [joueur]
    permission: fireballwand.vanish.level.1

  # ── Commandes TPA ──────────────────────────────────────────────────────────
  tpa:
    description: Envoyer une demande de téléportation à un joueur.
    usage: /tpa <joueur>
    permission: fireballwand.tpa

  tpahere:
    description: Demander à un joueur de se téléporter vers vous.
    usage: /tpahere <joueur>
    permission: fireballwand.tpahere

  tpaccept:
    description: Accepter une demande de téléportation en attente.
    usage: /tpaccept [joueur]
    aliases: [tpyes]
    permission: fireballwand.tpa

  tpdeny:
    description: Refuser une demande de téléportation en attente.
    usage: /tpdeny [joueur]
    aliases: [tpno]
    permission: fireballwand.tpa

  tpacancel:
    description: Annuler votre demande de téléportation envoyée.
    usage: /tpacancel
    permission: fireballwand.tpa

  tpareload:
    description: Recharger la configuration du TPA.
    usage: /tpareload
    permission: fireballwand.tpa.admin

permissions:

  # ── Commandes ──────────────────────────────────────────────────────────────
  fireballwand.firewand:
    description: Permet de give la FireWand
    default: op

  fireballwand.kickarmor:
    description: Permet de give la KickArmor
    default: op

  fireballwand.freezewand:
    description: Permet de give la FreezeWand
    default: op

  fireballwand.unfreezewand:
    description: Permet de dégeler tous les joueurs
    default: op

  fireballwand.wincharge_boosted:
    description: Permet de se give et d'utiliser la WinCharge Boosted
    default: op

  fireballwand.wincharge.bypass:
    description: Permet d'être totalement immunisé contre les explosions de la Wincharge
    default: op

  fireballwand.cheatsword:
    description: Give une épée Cheat
    default: op

  fireballwand.cheatmace:
    description: Give une Mace Cheat
    default: op

  fireballwand.diamond_armorcheat:
    description: Give une armure Diamant Cheat
    default: op

  fireballwand.netherite_armorcheat:
    description: Give une armure Netherite Cheat
    default: op

  fireballwand.potion-of-death:
    description: Permet de se give la Potion of Death
    default: op

  fireballwand.potion-of-death.bypass:
    description: Immunise contre la Potion of Death
    default: op

  # ── Kit / StartKit ─────────────────────────────────────────────────────────
  fireballwand.starterkit:
    description: Permet de réclamer le kit de départ avec /starter.
    default: true

  fireballwand.starterkit.bypass:
    description: Permet d'ignorer le cooldown du kit de départ.
    default: op

  # ── TPA ────────────────────────────────────────────────────────────────────
  fireballwand.tpa:
    description: Permet d'utiliser les commandes TPA de base.
    default: true

  fireballwand.tpahere:
    description: Permet d'utiliser la commande /tpahere.
    default: true

  fireballwand.tpa.admin:
    description: Permet de recharger la configuration du TPA.
    default: op

  fireballwand.tpa.bypass.cooldown:
    description: Permet de contourner le cooldown du TPA.
    default: op

  fireballwand.tpa.bypass.warmup:
    description: Permet de contourner le temps d'attente avant téléportation.
    default: op

  # ── Chat ───────────────────────────────────────────────────────────────────
  fireballwand.chat.color:
    description: Autoriser les codes couleur &x dans le chat
    default: false

  fireballwand.chat.color.hex:
    description: Autoriser les codes couleur HEX &#RRGGBB dans le chat
    default: false

  # ── Msg ───────────────────────────────────────────────────────────────────
  fireballwand.msg:
    description: Envoyer un message privé
    default: true

  fireballwand.reply:
    description: Répondre au dernier message privé
    default: true

  # ── Vanish ─────────────────────────────────────────────────────────────────
  fireballwand.vanish:
    description: Alias vanish (hérite level.1)
    default: false
    children:
      fireballwand.vanish.level.1: true

  fireballwand.vanish.others:
    description: Permet de vanisher un autre joueur
    default: op

  fireballwand.vanish.level.1:
    description: "Vanish niveau 1 — Helper"
    default: false

  fireballwand.vanish.level.2:
    description: "Vanish niveau 2 — Modérateur"
    default: false
    children:
      fireballwand.vanish.level.1: true

  fireballwand.vanish.level.3:
    description: "Vanish niveau 3 — Administrateur"
    default: false
    children:
      fireballwand.vanish.level.2: true

  fireballwand.vanish.level.4:
    description: "Vanish niveau 4 — Propriétaire"
    default: op
    children:
      fireballwand.vanish.level.3: true