name: FireballWand
main: fr.zyumie.fireballwand.Main
version: 3.0.0
api-version: 1.21
author: Zyumie
softdepend: [LuckPerms]

commands:
  firewand:
    description: Donne le bâton de feu
    usage: /firewand

  kickarmor:
    description: Donne une armure qui kick les joueurs à 3 blocs
    usage: /kickarmor

  freezewand:
    description: Donne un bâton qui freeze/unfreeze les joueurs
    usage: /freezewand

  unfreezewand-all:
    description: Dégèle tous les joueurs
    usage: /unfreezewand-all

  cheatsword:
    description: Donne une épée Cheat
    usage: /cheatsword

  cheatmace:
    description: Donne une Mace Cheat
    usage: /cheatmace

  diamond_armorcheat:
    description: Donne une armure en Diamant Cheat
    usage: /diamond-armorcheat

  netherite_armorcheat:
    description: Donne une armure en Netherite Cheat
    usage: /netherite-armorcheat

  vanish:
    description: Active/désactive le vanish
    usage: /vanish [joueur]
    permission: fireballwand.vanish.level.1


permissions:
  fireballwand.firewand:
    description: Permet de give la FireWand
    default: op

  fireballwand.kickarmor:
    description: Permet de give la KickArmor
    default: op

  fireballwand.freezewand:
    description: Permet de give la FreezeWand
    default: op

  fireballwand.unfreezewand:
    description: Permet de dégeler tous les joueurs
    default: op

  fireballwand.cheatsword:
    description: Give une épée Cheat
    default: op

  fireballwand.cheatmace:
    description: Give une Mace Cheat
    default: op

  fireballwand.diamond_armorcheat:
    description: Give une armure Diamant Cheat
    default: op

  fireballwand.netherite_armorcheat:
    description: Give une armure Netherite Cheat
    default: op

  # ── Vanish ───────────────────────────────────────────────────

  fireballwand.vanish:
    description: Permet d'utiliser /vanish (alias héritage)
    default: false
    children:
      fireballwand.vanish.level.1: true

  fireballwand.vanish.others:
    description: Permet de vanisher un autre joueur
    default: op

  # ── Niveaux hiérarchiques ───────────────────────────────────────────────────
  # Règle : level.N hérite de level.(N-1).
  # Un joueur de niveau N voit les vanishés de niveau 1..N.
  #
  # Attribution recommandée dans LuckPerms / permission manager :
  #   Helper → fireballwand.vanish.level.1
  #   Modo   → fireballwand.vanish.level.2
  #   Admin  → fireballwand.vanish.level.3
  #   Proprio→ fireballwand.vanish.level.4
  #
  # Vous pouvez ajouter autant de niveaux que nécessaire ;
  # mettez à jour "vanish.max-level" dans config.yml en conséquence.

  fireballwand.vanish.level.1:
    description: "Vanish niveau 1 — Helper (ne voit personne d'autre en vanish)"
    default: false

  fireballwand.vanish.level.2:
    description: "Vanish niveau 2 — Modérateur (voit les level 1 vanishés)"
    default: false
    children:
      fireballwand.vanish.level.1: true

  fireballwand.vanish.level.3:
    description: "Vanish niveau 3 — Administrateur (voit les level 1 et 2 vanishés)"
    default: false
    children:
      fireballwand.vanish.level.2: true

  fireballwand.vanish.level.4:
    description: "Vanish niveau 4 — Propriétaire (voit tous les vanishés)"
    default: op
    children:
      fireballwand.vanish.level.3: true
